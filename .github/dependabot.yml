# Dependabot version updates. Security updates are enabled in the repository settings.
# The pre-commit hook revisions in .pre-commit-config.yaml are not covered: refresh them with
# `pre-commit autoupdate --freeze`, and keep the ruff revision equal to the `lint` extra in pyproject.toml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: deps
