name: Release

# Pushing a tag `v<version>` builds the sdist and the wheel and publishes them to PyPI through trusted publishing
# (OpenID Connect; no API token is stored). No tests run here; test before tagging.
# pypa/gh-action-pypi-publish also uploads PEP 740 attestations for both files.
#
#   git tag v0.6.0rc2 && git push origin v0.6.0rc2
#
# PyPI trusted publisher: owner ProofAgent-ai, repository eio-agents, workflow release.yml, environment `pypi`.
# The tag must match the version in pyproject.toml and src/eio_agents/__init__.py; `.devN` versions are refused
# (GOVERNANCE.md: development builds are never published).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/eio-agents
    permissions:
      id-token: write  # trusted publishing and attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Check the version and the tag
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Version $version, ref $GITHUB_REF"
          grep -qx "__version__ = \"$version\"" src/eio_agents/__init__.py \
            || { echo "::error::src/eio_agents/__init__.py does not set __version__ = \"$version\""; exit 1; }
          case "$version" in *dev*) echo "::error::$version is a development build"; exit 1 ;; esac
          [ "$GITHUB_REF" = "refs/tags/v$version" ] \
            || { echo "::error::publish from the tag v$version (the ref is $GITHUB_REF)"; exit 1; }
      - name: Build
        run: |
          python -m pip install "build>=1.2" "twine>=6.1"
          python -m build
          python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
