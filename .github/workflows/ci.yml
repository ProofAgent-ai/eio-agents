name: CI

# Lint, the test suite on every supported Python, the minimum dependency versions, the built distributions (installed
# alone into a clean virtual environment, with ProofAgent Harness absent), and the goldens and conformance tools.
# Actions are pinned by commit; Dependabot proposes updates (.github/dependabot.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install ruff (the version pinned by the lint extra) and pre-commit
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['lint']))" > "$RUNNER_TEMP/lint-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/lint-requirements.txt" "pre-commit>=4"
      - name: ruff
        run: ruff check --output-format=github .
      - name: pre-commit hooks (file hygiene; byte-exact paths are excluded)
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-check
      - name: CITATION.cff
        run: |
          python -m pip install cffconvert
          cffconvert --validate

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package with the test extra
        run: python -m pip install -e ".[test]"
      - name: Test suite (includes the verifier self-test and the golden records)
        run: python -m pytest -q -p no:cacheprovider

  min-deps:
    name: Minimum dependencies (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
      - name: Install the lowest supported dependency versions, then the package
        run: |
          python -m pip install "pyyaml==6.0" "jsonschema==4.20.0" "pytest>=7"
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Test suite
        run: python -m pytest -q -p no:cacheprovider

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the build tools
        run: python -m pip install "build>=1.2" "twine>=6.1"
      - name: Build
        run: python -m build
      - name: twine check
        run: python -m twine check --strict dist/*
      - name: Check the contents of the distributions
        run: python .github/scripts/check_dist.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  wheel:
    name: Installed wheel (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
    steps:
      # The checkout provides the tests and their fixtures only; the package under test is the built wheel.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - name: Install the wheel alone into a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/eio_agents-*.whl "pytest>=7"
      - name: Check that ProofAgent Harness is absent and eio_agents comes from the wheel
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'EOF'
          import importlib.util
          import pathlib

          import eio_agents

          assert importlib.util.find_spec("proofagent_harness") is None, "proofagent_harness must not be importable"
          where = pathlib.Path(eio_agents.__file__).resolve()
          assert "site-packages" in where.parts, f"eio_agents imported from {where}, not from the installed wheel"
          print("eio_agents", eio_agents.__version__, "from", where)
          EOF
      - name: Console script
        run: '"$RUNNER_TEMP/wheel-venv/bin/eio-agents" version'
      - name: Test suite against the installed wheel
        run: '"$RUNNER_TEMP/wheel-venv/bin/python" -m pytest -q -p no:cacheprovider'
      - name: Verifier self-test (13 collected cases)
        run: '"$RUNNER_TEMP/wheel-venv/bin/python" -m pytest -q -p no:cacheprovider tests/test_verifier_selftest.py'

  conformance:
    name: Goldens and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package with the test extra
        run: python -m pip install ".[test]"
      - name: EIO release digests reproduce (RELEASE-DIGESTS.json)
        run: python tools/eio_digests.py
      - name: EIO release structure and rule gates against the native golden
        run: python tools/eio_gates.py --examples tests/data/native
      - name: EIO negative vectors against the native golden
        run: python tools/eio_gates.py --selftest --examples tests/data/native
      - name: Native golden, cited rc3 score and proof, stress, and verifier self-test
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_native.py tests/test_native_scored_end_to_end.py
          tests/test_goldens.py tests/test_stress.py tests/test_verifier_selftest.py
      - name: Verifier self-test summary
        run: python -m pytest -q -p no:cacheprovider tests/test_verifier_selftest.py
      - name: Native record digests (job summary)
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import pathlib

          import eio_agents

          print("| native bundle | release state | per_sha256 |")
          print("|---|---|---|")
          for name in ("source-complete.bundle.json", "synthetic-cited-native.bundle.json"):
              p = pathlib.Path("tests/data/native/v0_6", name)
              record = eio_agents.convert(p.read_bytes())
              state = record["release_recommendation"]["state"]
              print(f"| {name} | {state} | `{eio_agents.per_sha256(record)}` |")
          EOF

  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, test, min-deps, build, wheel, conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs passed."
