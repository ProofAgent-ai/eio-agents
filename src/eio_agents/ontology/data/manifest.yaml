  license: Apache-2.0

# Every module of the distribution is pinned at its exact version with its module_sha256
# ("sha256:" + hex(sha256(raw module file bytes))). A loader rejects an absent module, a version
# that differs from its pin, and a file whose bytes do not hash to its pin (EIO-2, EIO-3). The
# manifest cannot carry its own hash: the release digests (every module_sha256 including the
# manifest's, ontology_sha256 and ontology_digest) are published beside it in RELEASE-DIGESTS.json.
