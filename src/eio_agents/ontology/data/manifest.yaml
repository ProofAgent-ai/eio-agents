profiles:
  - id: eio.profile.public-release
    description: Public release metadata and production-claim boundary.
    release: 0.6.0
    local_only: true
    network_required: false
    remote_data_transfer: false
    authoring_format: YAML
    interchange_formats: [JSON, JSON-LD]
    normative_schemas: [module.schema.json, evidence-graph.schema.json, evaluation-claim.schema.json, reference-case.schema.json]
    production_status: candidate
    production_gate: Predicate reference cases must be independently reviewed and adjudicated before a module may claim production validation.
    # EIO-1. Semantic versioning while the release major version is 0.
    versioning:
      - While the release major version is 0, a breaking change (a change of meaning) bumps the MINOR version of the module and of the release and is listed under BREAKING in CHANGELOG.md.
      - An additive change bumps PATCH or MINOR; a text, title or comment change bumps PATCH.
      - An import pin is exact; EIO has no version ranges.
      - A predicate's version identifies its proposition (applicable_when, satisfied_when, violated_when, polarity, unknown_policy, evidence_contract, subsumes); the claim id includes it.
  # EIO-3. The release digests; their values for this release are in RELEASE-DIGESTS.json.
  - id: eio.profile.ontology-digest
    description: How module and ontology digests are computed and where they are published.
    module_sha256: '"sha256:" + hex(sha256(raw module file bytes))'
    ontology_sha256: '"sha256:" + hex(sha256(JCS({module_id: module_sha256}))) over every module the manifest imports plus the manifest itself'
    ontology_digest: the first 16 hex characters of ontology_sha256 (display value and the re-derivation trigger in per_semantics_version)
    rationale: >
      The hash is over raw file bytes, not over parsed YAML: YAML parsers disagree across languages,
      so a parsed-form hash would not be portable. A comment or whitespace edit is therefore a new
      patch release with new digests.
    published_in: RELEASE-DIGESTS.json
    per_header: 'header.eio carries release, ontology_digest, ontology_sha256 and modules {module_id: module_sha256}'
  - id: eio.profile.required-capsule-fields
    description: Minimum provenance captured for reproducible ontology-backed evaluation.
    required:
      - ontology release, every module id, version and module_sha256, and ontology_sha256
      - agent manifest, policy, tool schema, and domain profile hashes
      - test template, parameter binding, generator version, and seed
      - evidence graph schema, source hashes, and extractor versions
      - resolver code, model, prompt, sampling parameters, and cache identity
      - canonical claim and metric-view versions
      - tracked and untracked local repository state affecting execution
