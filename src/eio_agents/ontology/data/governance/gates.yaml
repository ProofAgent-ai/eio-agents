    - {"id":"side_effecting_support_tools","type":"boolean","description":"The support agent has side-effecting tools (refund, merge, password reset, contact change).","source":"profile"}
    - {"id":"side_effecting_tools","type":"boolean","description":"The agent has tools with side effects (it takes consequential actions).","source":"profile"}
    - {"id":"special_category_data","type":"boolean","description":"Special-category employee data can reach the agent.","source":"profile"}
    - {"id":"statutory_entitlement_surface","type":"boolean","description":"The agent handles statutory passenger entitlements.","source":"profile"}
    - {"id":"subject_affecting_decision","type":"boolean","description":"The agent makes a decision that affects a subject (test-template precondition).","source":"profile"}
    - {"id":"tier","type":"enum","values":["eio.tier.minimal","eio.tier.limited","eio.tier.elevated","eio.tier.high"],"description":"The deployment's resolved risk tier.","source":"profile"}
    - {"id":"tools","type":"boolean","description":"The agent has at least one tool.","source":"tool_schema"}
