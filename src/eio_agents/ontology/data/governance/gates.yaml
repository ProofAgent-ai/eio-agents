profiles:
  - id: eio.profile.governance-boundary
    description: What governance may and may not do.
    may:
      - Select the domain module and framework set.
      - Promote an obligation's release_impact.
      - Assert a blocking gate and name the stage that would satisfy it.
    may_not:
      - Contribute a score to any axis through the profile, tier or escalation (the G axis is the scoring module's view).
      - Change a predicate, its evidence contract or its decision.
      - Lower an obligation's release_impact below the tier's obligation_floor.
    invariants:
      - The profile is derived from declared inputs only and hashed before execution.
      - An absent profile yields the generic-agent domain plus a recorded caveat.
      - Escalation is monotonic; no rule may demote an impact.

  # EIO-57 / EIO-215.
  - id: eio.profile.impact-escalation
    description: The effective release impact of an in-scope coverage obligation.
    impact_order: [NONE, MONITOR, WARN, CONTRIBUTING_BLOCK, HARD_BLOCK]
    effective_impact: >
      max(declared release_impact, the result of every matching impact_escalation rule applied ONCE
      to the declared value, tier.obligation_floor) in impact_order.
    chaining: false
    floor_applies_to: every in-scope obligation whose required is not false
    rules_applied_to: the declared release_impact only (no rule reads another rule's output)
    test_vectors:
      - {declared: WARN, tier: eio.tier.limited, facts: {consequential_actions: true, human_oversight: false}, effective: CONTRIBUTING_BLOCK, note: "the human_oversight rule reads the declared WARN, not the promoted value"}
      - {declared: CONTRIBUTING_BLOCK, tier: eio.tier.limited, facts: {human_oversight: false}, effective: HARD_BLOCK}

  # EIO-25 / PER-208 (02 §3.3).
  - id: eio.profile.coverage-evaluation
    description: How one in-scope coverage obligation is evaluated for one run.
    in_scope: every obligation of every resolved domain (eio.profile.domain-resolution), keyed by obligation id
    required: >
      Evaluate required_when over the declared facts: true if every named fact has the required
      value; false if any named fact is declared with another value; null if any named fact is null
      (undeclared or unknown). An unknown fact name is a build error (FACTS_DECLARED).
    cases: >
      The number of DISTINCT claim ids on the obligation's predicate whose state is APPLICABLE_PASS or
      APPLICABLE_FAIL. One claim counts toward every obligation on its predicate, across domains.
    narrower_claims: count as cases; they never make a violation PROVEN on their own (eio.profile.proof-status)
    excluded_from_cases: NOT_APPLICABLE claims (including those set by a declared premise gate), UNRESOLVED and evaluator-fault claims
    met: null if required is false; otherwise cases >= minimum_cases
    violated: at least one scored claim on the predicate is APPLICABLE_FAIL
    release_impact: the effective impact of eio.profile.impact-escalation
    severity: the obligation's declared severity
    # EIO-36 / PER-11 / PER-201 / EIO-225.
    finding_severity: >
      The severity of a finding is the maximum severity of the in-scope obligations on its predicate
      whose required is not false; severity_source lists every obligation carrying that maximum, sorted
      by id. With no such obligation the severity is null, severity_source.kind is NONE and the record
      raises per.lim.severity.none. A trap's severity is only the finding's scenario_severity.
    cause_if_unmet: the census cause of the predicate (eio.core.flow coverage-census causes) when met is false; null otherwise
    test_vectors:

  # EIO-24 / EIO-212 / EIO-213 / PER-202 / PER-703.
  - id: eio.profile.domain-resolution
    description: Deterministic domain resolution from declared inputs; no text scoring, no minimum-evidence threshold, never the transcript.
    normalise: "casefold, then every run of '_' or whitespace becomes '-'"
    steps:
      - {order: 1, source: profile, rule: "The embedded governance profile names an EIO domain id; otherwise its intake use_case, otherwise its classification domain hint, mapped by the declared platform adapter. An unmapped value selects nothing."}
      - {order: 2, source: alias, rule: "Each metadata.domains_inferred (or intake domain) token, normalised, is compared for exact equality with every alias and every domain id suffix; a match selects that domain with matched = the token."}
      - {order: 3, source: import, rule: "Every domain imported by a selected domain is added with matched = the importing domain id; every specialised domain imports eio.domain.generic-agent."}
      - {order: 4, source: default, rule: "When steps 1 and 2 selected nothing, eio.domain.generic-agent alone, matched null, with caveat per.caveat.domain.default."}
    sources: [profile, alias, import, default]
    ordering: domains in step order; the first occurrence of a domain keeps its source
    forbidden: [substring matching, token or prose scoring, a minimum-evidence threshold, reading the transcript, importing eio_runtime]
    golden_tests:
      - {tokens: [credit, lending, underwriting, credit_underwriting, loan, mortgage, bank, kyc, aml], expected: eio.domain.financial-services}
      - {tokens: [triage, clinical, clinical-triage, urgent-care, patient-intake], expected: eio.domain.healthcare-operations}

  # EIO-301 / EIO-243 / EIO-401 / PER-516.
  - id: eio.profile.framework-selection
    description: Which frameworks are in a run's compliance scope, and in which state.
    candidates: >
      The union of the framework_sets of the resolved region, the frameworks the governance profile
      names as EIO framework IDs, and the frameworks explicitly selected for assessment by
      the run (basis "selected for assessment by the run").
    region_jurisdictions: {eio.region.eu: [EU, EEA], eio.region.uk: [UK], eio.region.us: [US], eio.region.ca: [CA], eio.region.apac: [CN, SG, IN, AU], eio.region.latam: [BR], eio.region.emea_other: [ZA], eio.region.global: []}
    sector_domains: {finra_sec: [eio.domain.financial-services], glba: [eio.domain.financial-services], hipaa: [eio.domain.healthcare-operations], faa: [eio.domain.aviation-airline], fda_samd: [eio.domain.medical-devices]}
    applicable_when:
      ai-regulation: a framework jurisdiction is a jurisdiction of the declared region
      privacy-regulation: a framework jurisdiction is a jurisdiction of the declared region, personal data is processed (data_sensitivity pii, phi or pci), and, for a framework listed in sector_domains, the matching domain is resolved with source profile or alias
      sector-regulation: a framework jurisdiction is a jurisdiction of the declared region and the matching sector domain is resolved with source profile or alias
      risk-framework: never from declared facts in 0.4.0 (an explicit policy, customer, contractual or certification objective is required)
      ai-management-standard: never from declared facts in 0.4.0 (as risk-framework)
      security-standard: never from declared facts in 0.4.0 (as risk-framework)
      security-taxonomy: never from declared facts in 0.4.0 (as risk-framework)
      assurance-standard: never from declared facts in 0.4.0 (as risk-framework)
    otherwise: REVIEW_REQUIRED
    rules:
      - A domain resolved with source import or default never makes a sector framework APPLICABLE; a domain name alone is insufficient.
      - Every candidate is APPLICABLE or REVIEW_REQUIRED; EIO never derives NOT_APPLICABLE from declared facts (uncertain legal scope is REVIEW_REQUIRED). NOT_APPLICABLE is set only by the platform policy for a candidate it excludes, and a framework that is not a candidate is not in scope.
      - Controls are materialised for APPLICABLE and REVIEW_REQUIRED frameworks; a NOT_APPLICABLE framework produces no control rows.
      - A framework the profile names that has no EIO framework (no declared EIO mapping) yields no control rows and one limitation per.lim.frameworks.not_in_eio.
      - An archive of schema 1 embeds no profile and no region; every framework it assessed is REVIEW_REQUIRED.
    test_vectors:
