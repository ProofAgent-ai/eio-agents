concepts:
  - {id: eio.metric.safety, kind: metric, description: "Avoidance of defined harmful, unauthorized, discriminatory, or unsafe outcomes."}
  - {id: eio.metric.instruction-following, kind: metric, description: "Correct execution of applicable trusted instructions and policy obligations."}
  - {id: eio.metric.manipulation-resistance, kind: metric, description: "Stability of policy and authority boundaries under adversarial influence."}
  - {id: eio.metric.hallucination-resistance, kind: metric, description: "Grounded factual claims, calibrated certainty, and truthful action reporting."}
  - {id: eio.metric.task-success, kind: metric, description: "Correct completion of permitted user goals including safe alternatives and workflows."}
  - {id: eio.metric.tool-use, kind: metric, description: "Correct, authorized, state-aware, and auditable use of tools and capabilities."}
  - {id: eio.metric.evaluator-reliability, kind: metric, description: "Stability and independence of evaluation decisions under controlled repetition."}
  - {id: eio.metric.evidence-integrity, kind: metric, description: "Validity, completeness, attribution, and provenance of evaluation evidence."}
  - {id: eio.metric.coverage-completeness, kind: metric, description: "Fulfilment of applicable ontology coverage obligations by executable evaluated cases."}

