[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eio-agents"
version = "0.6.0rc1"
description = "Reference library for the Evaluation Intelligence Ontology (EIO) and PER 2.0 evaluation records for AI agents: convert, validate, verify, explain."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
  { name = "Dr. Fouad Bousetouane" },
  { name = "ProofAI LLC", email = "support@proofagent.ai" },
]
maintainers = [{ name = "ProofAgent", email = "support@proofagent.ai" }]
keywords = [
  "ai-agents",
  "agent-evaluation",
  "evaluation-record",
  "evidence",
  "ontology",
  "json-schema",
  "json-ld",
  "rfc8785",
  "verification",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# The lower bounds are tested by the minimum-dependency CI job. The upper bounds keep out an untested major version.
dependencies = [
  "pyyaml>=6.0,<7",
  "jsonschema>=4.20,<5",
]

[project.urls]
Homepage = "https://www.proofagent.ai/eio-agents/schema/"
Repository = "https://github.com/ProofAgent-ai/eio-agents"
Documentation = "https://github.com/ProofAgent-ai/eio-agents/tree/main/docs"
Issues = "https://github.com/ProofAgent-ai/eio-agents/issues"
Changelog = "https://github.com/ProofAgent-ai/eio-agents/blob/main/CHANGELOG.md"
Security = "https://github.com/ProofAgent-ai/eio-agents/security/policy"

[project.optional-dependencies]
# `test` runs the suite. `lint` pins the ruff version that CI uses; keep it equal to the ruff `rev` in
# .pre-commit-config.yaml. `build` builds and checks the distributions. `dev` is all of them plus pre-commit.
test = ["pytest>=7"]
lint = ["ruff==0.16.9"]
build = ["build>=1.2", "twine>=6.1"]
dev = [
  "pytest>=7",
  "ruff==0.16.9",
  "build>=1.2",
  "twine>=6.1",
  "pre-commit>=4",
]

[project.scripts]
eio-agents = "eio_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eio_agents"]

[tool.hatch.build.targets.sdist]
include = ["src/eio_agents", "tests", "tools", "docs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "SECURITY.md", "GOVERNANCE.md", "CITATION.cff", "pyproject.toml"]
exclude = [
  "/tests/data/bundles/**",
  "/tests/data/raw/**",
  "/tests/data/stress/**",
  "/tests/data/expected/**",
  "/tests/data/examples/**",
  "/tests/data/spec/**",
  "/tests/data/context/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
# Many existing lines are longer. E501 is not selected, and `ruff format` is not used: it would rewrite most files.
line-length = 120
# Keep any exclusion when files are passed by name, as pre-commit does.
force-exclude = true

[tool.ruff.lint]
# The classic ruff default rules, selected explicitly so that a newer ruff does not widen the set.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Findings that predate this configuration. They are listed for step L2 and not fixed here, so that the library code
# stays exactly as tested.
"src/eio_agents/validation/checker.py" = ["E731", "E741"]
"tests/test_verifier_selftest.py" = ["E741"]
"tools/eio_gates.py" = ["E702"]
